<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Produto</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Estoque Fácil</a>
    </div>
</nav>

<div class="container mt-4">

    <div class="card">

        <div class="card-header">
            <h4>Cadastro de Produto</h4>
        </div>

        <div class="card-body">

            <form th:action="@{/produtos/salvar}"
                  th:object="${produto}"
                  method="post">

                <input type="hidden" th:field="*{id}">

                <div class="row">

                    <div class="col-md-4 mb-3">
                        <label>Código</label>
                        <input type="text"
                               th:field="*{codigo}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-8 mb-3">
                        <label>Nome do produto</label>
                        <input type="text"
                               th:field="*{nome}"
                               class="form-control"
                               required>
                    </div>

                </div>

                <div class="mb-3">
                    <label>Descrição</label>
                    <textarea th:field="*{descricao}"
                              class="form-control"></textarea>
                </div>

                <div class="mb-3">
                    <label for="categoriaNome">Categoria (opcional)</label>

                    <input type="text"
                           id="categoriaNome"
                           name="categoriaNome"
                           th:value="${categoriaNome}"
                           class="form-control"
                           placeholder="Digite uma categoria">

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Preço de custo</label>
                        <input type="number"
                               step="0.01"
                               min="0"
                               th:field="*{precoCusto}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Preço de venda</label>
                        <input type="number"
                               step="0.01"
                               min="0"
                               th:field="*{precoVenda}"
                               class="form-control"
                               required>
                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">
                        <label>Quantidade</label>
                        <input type="number"
                               min="0"
                               th:field="*{quantidade}"
                               class="form-control"
                               required>
                    </div>

                    <div class="col-md-6 mb-3">
                        <label>Estoque mínimo</label>
                        <input type="number"
                               min="0"
                               th:field="*{estoqueMinimo}"
                               class="form-control"
                               required>
                    </div>

                </div>

                <button class="btn btn-success">
                    Salvar Produto
                </button>

                <a href="/produtos" class="btn btn-secondary">
                    Voltar
                </a>

            </form>

        </div>
    </div>

</div>

</body>
</html>
