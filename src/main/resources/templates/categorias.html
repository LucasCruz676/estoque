<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Categorias</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Estoque Fácil</a>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">
        <h2>Categorias</h2>

        <a href="/categorias/novo" class="btn btn-primary">
            Nova Categoria
        </a>
    </div>

    <div th:if="${sucesso}"
         class="alert alert-success"
         th:text="${sucesso}">
    </div>

    <div th:if="${erro}"
         class="alert alert-danger"
         th:text="${erro}">
    </div>

    <table class="table table-bordered">

        <thead>
        <tr>
            <th>ID</th>
            <th>Nome</th>
            <th>Descrição</th>
            <th>Ações</th>
        </tr>
        </thead>

        <tbody>

        <tr th:each="c : ${categorias}">

            <td th:text="${c.id}"></td>
            <td th:text="${c.nome}"></td>
            <td th:text="${c.descricao}"></td>

            <td>
                <a th:href="@{/categorias/editar/{id}(id=${c.id})}"
                   class="btn btn-warning btn-sm">
                    Editar
                </a>

                <form th:action="@{/categorias/excluir/{id}(id=${c.id})}"
                      method="post"
                      class="d-inline"
                      onsubmit="return confirm('Deseja excluir?')">

                    <button class="btn btn-danger btn-sm">
                        Excluir
                    </button>

                </form>
            </td>

        </tr>

        </tbody>

    </table>

    <a href="/" class="btn btn-secondary">Voltar</a>

</div>

</body>
</html>
