<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Produtos - Estoque Fácil</title>

    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Estoque Fácil</a>
        <div>
            <a href="/" class="btn btn-light btn-sm">Início</a>
            <a href="/categorias" class="btn btn-light btn-sm">Categorias</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <div class="d-flex justify-content-between mb-3">
        <h2>Produtos</h2>

        <a href="/produtos/novo" class="btn btn-primary">
            + Novo Produto
        </a>
    </div>

    <div th:if="${sucesso}"
         class="alert alert-success"
         th:text="${sucesso}">
    </div>

    <div th:if="${erro}"
         class="alert alert-danger"
         th:text="${erro}">
    </div>

    <form action="/produtos" method="get" class="mb-3">
        <div class="input-group">

            <input type="text"
                   name="busca"
                   th:value="${busca}"
                   class="form-control"
                   placeholder="Pesquisar produto">

            <button class="btn btn-primary">
                Pesquisar
            </button>

        </div>
    </form>

    <div class="card">
        <div class="card-body table-responsive">

            <table class="table table-hover">

                <thead>
                <tr>
                    <th>Código</th>
                    <th>Produto</th>
                    <th>Categoria</th>
                    <th>Preço</th>
                    <th>Quantidade</th>
                    <th>Status</th>
                    <th>Ações</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="p : ${produtos}">

                    <td th:text="${p.codigo}"></td>
                    <td th:text="${p.nome}"></td>
                    <td th:text="${p.categoria != null ? p.categoria.nome : '—'}"></td>

                    <td th:text="${#numbers.formatCurrency(p.precoVenda)}"></td>

                    <td th:text="${p.quantidade}"></td>

                    <td>

                        <span th:if="${p.quantidade == 0}"
                              class="badge bg-danger">
                            Sem estoque
                        </span>

                        <span th:if="${p.quantidade > 0 and p.quantidade <= p.estoqueMinimo}"
                              class="badge bg-warning text-dark">
                            Estoque baixo
                        </span>

                        <span th:if="${p.quantidade > p.estoqueMinimo}"
                              class="badge bg-success">
                            Normal
                        </span>

                    </td>

                    <td>

                        <a th:href="@{/produtos/editar/{id}(id=${p.id})}"
                           class="btn btn-warning btn-sm">
                            Editar
                        </a>

                        <form th:action="@{/produtos/excluir/{id}(id=${p.id})}"
                              method="post"
                              class="d-inline"
                              onsubmit="return confirm('Deseja excluir?')">

                            <button class="btn btn-danger btn-sm">
                                Excluir
                            </button>

                        </form>

                    </td>

                </tr>

                <tr th:if="${#lists.isEmpty(produtos)}">
                    <td colspan="7" class="text-center">
                        Nenhum produto cadastrado.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
