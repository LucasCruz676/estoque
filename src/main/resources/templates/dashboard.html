<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estoque Fácil</title>
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<nav class="navbar navbar-dark bg-primary">
    <div class="container">
        <a class="navbar-brand" href="/">Estoque Fácil</a>
        <div>
            <a href="/" class="btn btn-light btn-sm">Início</a>
            <a href="/produtos" class="btn btn-light btn-sm">Produtos</a>
            <a href="/categorias" class="btn btn-light btn-sm">Categorias</a>
        </div>
    </div>
</nav>

<div class="container mt-4">

    <h2>Dashboard</h2>
    <p class="text-muted">Resumo geral do estoque</p>

    <div class="row g-3">

        <div class="col-md-4">
            <div class="card indicador">
                <div class="card-body">
                    <h6>Total de produtos</h6>
                    <h2 th:text="${totalProdutos}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card indicador">
                <div class="card-body">
                    <h6>Produtos com estoque baixo</h6>
                    <h2 th:text="${#lists.size(produtosBaixos)}">0</h2>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card indicador">
                <div class="card-body">
                    <h6>Valor total do estoque</h6>
                    <h2 th:text="${#numbers.formatCurrency(totalEstoque)}">
                        R$ 0,00
                    </h2>
                </div>
            </div>
        </div>

    </div>

    <div class="card mt-4">

        <div class="card-header">
            Produtos com estoque baixo
        </div>

        <div class="card-body">

            <table class="table table-striped">

                <thead>
                <tr>
                    <th>Produto</th>
                    <th>Quantidade</th>
                    <th>Estoque mínimo</th>
                </tr>
                </thead>

                <tbody>

                <tr th:each="p : ${produtosBaixos}">
                    <td th:text="${p.nome}"></td>
                    <td th:text="${p.quantidade}"></td>
                    <td th:text="${p.estoqueMinimo}"></td>
                </tr>

                <tr th:if="${#lists.isEmpty(produtosBaixos)}">
                    <td colspan="3" class="text-center">
                        Nenhum produto com estoque baixo.
                    </td>
                </tr>

                </tbody>

            </table>

        </div>
    </div>

</div>

</body>
</html>
